<title>Deal Pipeline</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --void:#0A0C0F;
    --panel:#14171C;
    --panel2:#1B1F26;
    --line:#2C333C;
    --line2:#3B444F;
    --paper:#F2F5F8;
    --dim:#8B959F;
    --dimmer:#5C656F;
    --late:#FF3B30;
    --late-ink:#1E1012;
    --risk:#FFB400;
    --good:#22C55E;
    --act:#3B7BFF;
    --cash:#4DD9C0;
    --heavy:"Anton","Arial Narrow",Impact,"Haettenschweiler",sans-serif;
    --sans:"Archivo","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--void);color:var(--paper);
    font-family:var(--sans);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1140px;margin:0 auto;padding-inline:16px;padding-block:0 96px}

  /* ---------- top bar ---------- */
  .bar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding-block:16px 14px;border-bottom:3px solid var(--paper);
  }
  .brand{font-family:var(--heavy);font-size:30px;letter-spacing:.01em;line-height:1}
  .brand span{color:var(--act)}
  .you{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;
    font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .you input{
    font:inherit;font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;
    background:var(--panel);color:var(--paper);
    border:2px solid var(--line);border-radius:0;padding:7px 10px;width:168px;
  }
  .you input:focus{border-color:var(--act);outline:none}

  /* ---------- live strip ---------- */
  .live{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:9px 0;border-bottom:1px solid var(--line)}
  .conn{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;
    letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
  .dot{width:8px;height:8px;background:var(--dimmer);flex:none;border-radius:50%}
  .conn[data-on="1"]{color:var(--good)}
  .conn[data-on="1"] .dot{background:var(--good);animation:beat 2.4s ease-in-out infinite}
  .conn[data-on="solo"]{color:var(--risk)}
  .conn[data-on="solo"] .dot{background:var(--risk)}
  @keyframes beat{0%,100%{opacity:1}50%{opacity:.3}}
  @media (prefers-reduced-motion:reduce){.conn[data-on="1"] .dot{animation:none}}
  .who{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-left:auto}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 4px;
    background:var(--panel);border:1px solid var(--line);
    font-size:11.5px;font-weight:700;color:var(--paper);max-width:150px}
  .chip i{font-style:normal;width:18px;height:18px;display:grid;place-items:center;flex:none;
    font-size:10px;font-weight:800;color:#0A0C0F;font-family:var(--sans)}
  .chip s{text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chip.self{border-color:var(--line2)}
  .chip.self s::after{content:" (you)";color:var(--dim);font-weight:600}

  /* ---------- goal ---------- */
  .goal{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin:22px 0 6px}
  .goal h1{font-family:var(--heavy);font-size:clamp(30px,6vw,54px);line-height:.94;
    margin:0;text-transform:uppercase;font-weight:400}
  .goal h1 b{color:var(--act);font-weight:400}
  .goalbar{flex:1 1 260px;min-width:200px}
  .track{height:12px;background:var(--panel2);border:1px solid var(--line);display:flex}
  .track i{display:block;height:100%}
  .track i.done{background:var(--good)}
  .track i.wip{background:var(--act)}
  .tracklabel{display:flex;justify-content:space-between;gap:10px;margin-top:6px;
    font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
  .vsub{color:var(--dim);font-size:14px;font-weight:600;margin:0 0 20px;max-width:66ch}

  /* ---------- board switch ---------- */
  .boards{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);
    margin-bottom:18px}
  .boards button{
    background:transparent;border:none;border-bottom:4px solid transparent;
    color:var(--dim);padding:11px 14px;font-weight:800;font-size:13px;
    text-transform:uppercase;letter-spacing:.05em;margin-bottom:-2px;
  }
  .boards button:hover{color:var(--paper)}
  .boards button[aria-pressed="true"]{color:var(--paper);border-bottom-color:var(--act)}
  .boards button b{font-variant-numeric:tabular-nums;color:var(--dimmer);margin-left:6px}
  .boards button[aria-pressed="true"] b{color:var(--act)}

  /* ---------- tiles ---------- */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:8px;margin-bottom:20px}
  .tile{background:var(--panel);border-left:8px solid var(--line);padding:12px 14px 11px}
  .tile b{display:block;font-family:var(--heavy);font-size:34px;line-height:.95;
    font-variant-numeric:tabular-nums;font-weight:400}
  .tile em{font-style:normal;font-size:11px;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;color:var(--dim)}
  .tile.blue{border-left-color:var(--act)}   .tile.blue b{color:var(--act)}
  .tile.amber{border-left-color:var(--risk)} .tile.amber b{color:var(--risk)}
  .tile.red{border-left-color:var(--late)}   .tile.red b{color:var(--late)}
  .tile.green{border-left-color:var(--good)} .tile.green b{color:var(--good)}
  .tile.cash{border-left-color:var(--cash)}  .tile.cash b{color:var(--cash);font-size:27px}
  .tile.grey b{color:var(--dim)}

  /* ---------- buttons ---------- */
  button{font:inherit;cursor:pointer;border-radius:0}
  .b{background:var(--act);color:#fff;border:none;padding:12px 16px;
    font-weight:800;font-size:13.5px;letter-spacing:.03em;text-transform:uppercase}
  .b:hover{filter:brightness(1.14)}
  .b.go{background:var(--good);color:#04220F}
  .b.hot{background:var(--late);color:#fff}
  .b.ghost{background:transparent;color:var(--paper);border:2px solid var(--line);padding:10px 14px}
  .b.ghost:hover{border-color:var(--paper)}
  .b:disabled{opacity:.35;cursor:not-allowed;filter:none}
  :focus-visible{outline:3px solid var(--act);outline-offset:2px}

  .toprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .filters{display:flex;gap:3px;margin-left:auto;flex-wrap:wrap}
  .filters button{background:transparent;border:2px solid transparent;color:var(--dim);
    padding:8px 10px;font-weight:800;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
  .filters button:hover{color:var(--paper)}
  .filters button[aria-pressed="true"]{background:var(--panel);border-color:var(--line);color:var(--paper)}
  .filters button b{font-variant-numeric:tabular-nums;color:var(--dimmer);margin-left:5px}

  /* ---------- add panel ---------- */
  .add{background:var(--panel);border-left:8px solid var(--act);padding:14px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
  .f label{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;
    color:var(--dim);margin-bottom:5px;text-transform:uppercase}
  .f input,.f select{font:inherit;font-size:14px;width:100%;padding:10px;
    background:var(--panel2);color:var(--paper);border:2px solid var(--line)}
  .f input:focus,.f select:focus{border-color:var(--act);outline:none}
  .f input[type=date],.f input[inputmode=numeric]{font-family:var(--mono);font-size:13px}
  .go-row{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* ---------- rows ---------- */
  .row{background:var(--panel);border-left:8px solid var(--line);margin-bottom:10px}
  .row[data-tone="red"]{border-left-color:var(--late);background:var(--late-ink)}
  .row[data-tone="amber"]{border-left-color:var(--risk)}
  .row[data-tone="blue"]{border-left-color:var(--act)}
  .row[data-tone="green"]{border-left-color:var(--good)}
  .head{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:14px 14px 12px;align-items:start}
  .addr{font-family:var(--heavy);font-size:clamp(18px,2.9vw,25px);line-height:1.06;
    text-transform:uppercase;text-wrap:balance;margin:0;font-weight:400}
  .meta{color:var(--dim);font-size:12.5px;font-weight:600;margin-top:7px}
  .meta b{color:var(--paper);font-weight:700}
  .flag{font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    white-space:nowrap;justify-self:end;line-height:1.2;text-align:right}
  .flag[data-tone="red"]{color:var(--late)}
  .flag[data-tone="amber"]{color:var(--risk)}
  .flag[data-tone="blue"]{color:var(--act)}
  .flag[data-tone="green"]{color:var(--good)}
  .flag u{display:block;text-decoration:none;font-family:var(--mono);font-size:11px;
    font-weight:500;letter-spacing:.02em;margin-top:4px;opacity:.85}

  .strip{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .stat em{display:block;font-style:normal;font-size:10.5px;font-weight:800;
    letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}
  .stat span{font-family:var(--mono);font-size:13.5px;font-weight:500}
  .stat span.miss{color:var(--dimmer)}
  .stat span.money{color:var(--cash);font-weight:700}
  .fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .row[data-tone="red"] .f input,.row[data-tone="red"] .f select{background:#241519;border-color:#3A1F22}
  .row[data-tone="red"] .f input:focus,.row[data-tone="red"] .f select:focus{border-color:var(--act)}
  .row input.doc{font-family:var(--mono);font-weight:700;letter-spacing:.02em}
  .btns{display:flex;gap:8px;flex-wrap:wrap}
  .btns .b{flex:1 1 190px}
  .btns .b.mid{flex:0 1 200px}
  .warn{color:var(--late);font-weight:700;font-size:13px;margin:0}
  .stamp{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--good);
    border-left:3px solid var(--good);padding-left:10px;margin:0}
  .stamp b{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.07em;
    text-transform:uppercase;margin-right:8px}
  .recgrp{border-left:3px solid var(--line);padding-left:10px}
  .recgrp[data-done="1"]{border-left-color:var(--good)}
  .recgrp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:7px;
    font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--paper)}
  .recgrp-h i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--good)}
  .recgrp-h i.pending{color:var(--dimmer)}
  .stamp small{display:block;color:var(--dim);font-family:var(--sans);font-size:12px;
    font-weight:600;margin-top:2px}

  .log{padding:0 14px 14px}
  .log summary{cursor:pointer;color:var(--dim);font-size:11px;font-weight:800;
    letter-spacing:.07em;text-transform:uppercase;padding:4px 0}
  .log summary:hover{color:var(--paper)}
  .log ol{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;color:var(--dim)}
  .log li{padding:7px 0;border-bottom:1px solid var(--line);
    display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:baseline}
  .row[data-tone="red"] .log li{border-bottom-color:#3A1F22}
  .log li b.au{font-size:12px;font-weight:800;white-space:nowrap;letter-spacing:.01em}
  .log li .tx{color:var(--paper);font-weight:500}
  .log li.sys .tx{color:var(--dim);font-weight:600}
  .log li time{font-family:var(--mono);font-size:11px;color:var(--dimmer);
    white-space:nowrap;text-align:right}
  .post{display:flex;gap:8px;margin-top:12px}
  .post input{flex:1 1 auto;min-width:0;font:inherit;font-size:13.5px;padding:10px 12px;
    background:var(--panel2);color:var(--paper);border:2px solid var(--line)}
  .post input::placeholder{color:var(--dimmer)}
  .post input:focus{border-color:var(--act);outline:none}
  .post button{flex:none;background:var(--act);color:#fff;border:none;padding:10px 18px;
    font-weight:800;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
  .post button:hover{filter:brightness(1.14)}
  .row[data-tone="red"] .post input{background:#241519;border-color:#3A1F22}
  .row[data-tone="red"] .post input:focus{border-color:var(--act)}
  .follow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .tag{background:transparent;border:1px solid var(--line);color:var(--dim);
    font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px}
  .tag:hover{border-color:var(--paper);color:var(--paper)}
  .tag[aria-pressed="true"]{border-color:var(--good);color:var(--good)}
  .tag.danger:hover{border-color:var(--late);color:var(--late)}

  /* ---------- empty ---------- */
  .empty{border:3px dashed var(--line);padding:34px 20px;text-align:center}
  .empty h2{font-family:var(--heavy);font-size:clamp(20px,4vw,32px);
    text-transform:uppercase;margin:0 0 8px;font-weight:400}
  .empty p{color:var(--dim);font-size:14px;font-weight:600;margin:0 auto 20px;max-width:48ch}

  .hidden{display:none!important}

  /* ---------- toast + dialog ---------- */
  .toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:6px;align-items:center;z-index:60;width:min(92vw,520px)}
  .toast{background:var(--paper);color:#0A0C0F;padding:11px 16px;font-weight:800;font-size:13.5px;
    box-shadow:0 6px 22px rgba(0,0,0,.5);max-width:100%}
  .toast.peer{background:var(--act);color:#fff}
  dialog.box{border:3px solid var(--paper);background:var(--panel);color:var(--paper);
    padding:0;max-width:min(94vw,580px);width:100%}
  dialog.box::backdrop{background:rgba(6,8,10,.78)}
  .box h3{font-family:var(--heavy);font-size:22px;text-transform:uppercase;margin:0;
    padding:14px 16px;border-bottom:2px solid var(--line);font-weight:400}
  .box textarea{font:inherit;font-family:var(--mono);font-size:12.5px;line-height:1.6;width:100%;
    min-height:180px;background:var(--panel2);color:var(--paper);border:none;
    border-bottom:2px solid var(--line);padding:14px 16px;resize:vertical;display:block}
  .box textarea:focus{outline:none;background:#20252D}
  .box .go-row{margin:0;padding:12px 16px}

  @media (max-width:620px){
    .log li{grid-template-columns:1fr auto}
    .log li .tx{grid-column:1 / -1}
    .head{grid-template-columns:1fr}
    .flag{justify-self:start;text-align:left}
    .you{margin-left:0;width:100%}
    .you input{flex:1;width:auto}
    .who{margin-left:0;width:100%}
    .filters{margin-left:0;width:100%}
    .btns .b,.btns .b.mid{flex:1 1 100%}
  }
</style>

<div class="wrap">

  <header class="bar">
    <div class="brand">PIPE<span>LINE</span></div>
    <div class="you">
      <label for="me">You</label>
      <input id="me" type="text" placeholder="your name" autocomplete="off" maxlength="28">
    </div>
  </header>

  <div class="live">
    <div class="conn" id="conn"><span class="dot"></span><span id="connText">Connecting</span></div>
    <div class="who" id="who"></div>
  </div>

  <div class="goal">
    <h1 id="goalLine">Goal <b>20</b> properties</h1>
    <div class="goalbar">
      <div class="track" id="track"></div>
      <div class="tracklabel"><span id="trackLeft">—</span><span id="trackRight">—</span></div>
    </div>
  </div>
  <p class="vsub" id="vsub">Acquisition, disposition and what actually sold. Nothing counts as closed until it records.</p>

  <nav class="boards" id="boards" aria-label="Boards">
    <button type="button" data-b="acq" aria-pressed="true">Acquisition <b data-bc="acq">0</b></button>
    <button type="button" data-b="dispo" aria-pressed="false">Disposition <b data-bc="dispo">0</b></button>
    <button type="button" data-b="sold" aria-pressed="false">Sold this month <b data-bc="sold">0</b></button>
  </nav>

  <div class="tiles" id="tiles"></div>

  <div class="toprow">
    <button class="b" id="addBtn">+ Add property</button>
    <button class="b ghost" id="exportBtn">Export CSV</button>
    <div class="filters" id="filters"></div>
  </div>

  <section class="add hidden" id="addPanel" aria-label="Add a property">
    <div class="grid">
      <div class="f"><label for="n-addr">Property address</label>
        <input id="n-addr" placeholder="8000 Earl St, Oakland CA" maxlength="120"></div>
      <div class="f"><label for="n-lead">Lead source</label><select id="n-lead"></select></div>
      <div class="f"><label for="n-price">Purchase price</label>
        <input id="n-price" inputmode="numeric" placeholder="450000" maxlength="12"></div>
      <div class="f"><label for="n-close">Closing date</label><input id="n-close" type="date"></div>
      <div class="f"><label for="n-exit">Exit strategy</label><select id="n-exit"></select></div>
      <div class="f"><label for="n-status">Status</label><select id="n-status"></select></div>
      <div class="f"><label for="n-sale">Sale price</label>
        <input id="n-sale" inputmode="numeric" placeholder="optional" maxlength="12"></div>
      <div class="f"><label for="n-owner">Owner (one name)</label>
        <input id="n-owner" placeholder="who drives it" maxlength="40"></div>
      <div class="f"><label for="n-escrow">Title / escrow</label>
        <input id="n-escrow" placeholder="optional" maxlength="80"></div>
    </div>
    <p class="warn hidden" id="addWarn" style="padding-top:10px"></p>
    <div class="go-row">
      <button class="b go" id="saveNew">Put it on the board</button>
      <button class="b ghost" id="cancelNew">Cancel</button>
    </div>
  </section>

  <div id="ledger"></div>

  <section class="empty hidden" id="empty">
    <h2 id="emptyTitle">Nothing on this board</h2>
    <p id="emptyText">Add the first property and it shows up for everyone on this link.</p>
    <div class="go-row" style="justify-content:center">
      <button class="b" id="emptyAdd">Add a property</button>
    </div>
  </section>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<dialog class="box" id="copyBox" aria-labelledby="copyTitle">
  <h3 id="copyTitle">Copy this</h3>
  <textarea id="copyText" readonly spellcheck="false"></textarea>
  <div class="go-row">
    <button class="b" id="copyAgain">Select all</button>
    <button class="b ghost" id="copyClose">Close</button>
  </div>
</dialog>

<script>
(function(){
  "use strict";

  /* ===================== config ===================== */
  var NAME_KEY = "pipeline.me.v1", BOARD_KEY = "pipeline.board.v1", SOLO_KEY = "pipeline.deals.v1";
  var GOAL = 20;
  var RISK_WINDOW = 5;   /* days to closing that flips a row amber */

  var BOARDS = ["acq","dispo","sold"];
  var BOARD_NAME = {acq:"Acquisition", dispo:"Disposition", sold:"Sold this month"};

  var STATUS = {
    acq:   ["Under contract","Acquired","Wholesaled","Cancelled"],
    dispo: ["Under construction","Listed","Listed — pending","Sold"],
    sold:  ["Closed"]
  };
  /* how each status paints the row */
  var TONE = {
    "Under contract":"blue", "Acquired":"green", "Wholesaled":"green", "Cancelled":"grey",
    "Under construction":"amber", "Listed":"blue", "Listed — pending":"blue", "Sold":"green",
    "Closed":"green"
  };
  var LEADS = ["PPC — Google Ads","DM — Post Card","SEO","Property leads","MLS / Redfin",
               "Cold call","Referral","Other"];
  var EXITS = ["Wholesale- Assignment","Wholesale- Double Close",
               "Buy- Wholetail","Buy- Fix & Flip",
               "Sale- Wholetail","Sale- Fix & Flip"];
  var SIDES = [{key:"buyer", name:"Buyer"}, {key:"seller", name:"Seller"}];
  var SOURCES = ["Select proof type","Recorded copy","Title confirmation",
                 "Escrow confirmation","County record"];
  var INK = ["#FF6B5A","#FFB400","#22C55E","#3B7BFF","#C77DFF","#4DD9C0","#FF8FB1","#9EC5FF"];

  /* ===================== state ===================== */
  var deals  = new Map();
  var drafts = new Map();
  var opened = new Set();
  var peers  = [];
  var board  = readBoard();
  var filter = "all";
  var me     = readName();
  var db = null, room = null, dl = null;
  var live = false, connected = false, lastSig = null;

  /* ===================== helpers ===================== */
  function byId(i){ return document.getElementById(i); }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function readName(){ try { return localStorage.getItem(NAME_KEY) || ""; } catch(e){ return ""; } }
  function writeName(v){ try { localStorage.setItem(NAME_KEY, v); } catch(e){} }
  function readBoard(){
    try { var b = localStorage.getItem(BOARD_KEY); return BOARDS.indexOf(b) >= 0 ? b : "acq"; }
    catch(e){ return "acq"; }
  }
  function writeBoard(v){ try { localStorage.setItem(BOARD_KEY, v); } catch(e){} }
  function who(){ return me.trim() || "Someone"; }
  function uid(){ return "d" + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function logKey(){ return String(Date.now()) + "-" + Math.random().toString(36).slice(2,7); }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" +
           String(d.getDate()).padStart(2,"0");
  }
  var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtDate(iso){
    if(!iso) return "";
    var p = String(iso).slice(0,10).split("-");
    if(p.length < 3) return String(iso);
    return MON[+p[1]-1] + " " + (+p[2]) + ", " + p[0];
  }
  function fmtStamp(iso){
    var d = new Date(iso);
    if(isNaN(d)) return String(iso || "");
    var p = String(iso).slice(0,10).split("-");
    return MON[+p[1]-1] + " " + (+p[2]) + " " +
           d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  }
  function dayDiff(a, b){
    if(!a || !b) return null;
    return Math.round((new Date(b+"T00:00:00") - new Date(a+"T00:00:00")) / 86400000);
  }
  function num(v){
    if(v == null || v === "") return null;
    var n = Number(String(v).replace(/[^0-9.\-]/g, ""));
    return isNaN(n) ? null : n;
  }
  function money(n){
    if(n == null) return "";
    return "$" + Math.round(n).toLocaleString("en-US");
  }
  function moneyShort(n){
    if(n == null) return "$0";
    var a = Math.abs(n);
    if(a >= 1000000) return "$" + (n/1000000).toFixed(a >= 10000000 ? 0 : 1).replace(/\.0$/,"") + "M";
    if(a >= 1000)    return "$" + Math.round(n/1000) + "K";
    return "$" + Math.round(n);
  }
  function plural(n, w){ return n + " " + w + (Math.abs(n) === 1 ? "" : "s"); }
  function colorFor(name){
    var s = String(name || "?"), h = 0;
    for(var i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
    return INK[h % INK.length];
  }
  function initials(name){
    var p = String(name || "?").trim().split(/\s+/).filter(Boolean);
    return p.length ? (p[0][0] + (p[1] ? p[1][0] : "")).toUpperCase() : "?";
  }
  /* The pick list is exactly the six strategies — nothing else is offered.
     A row that is unset, or still carries an older value, shows that as a
     HIDDEN placeholder option: it displays as the row's current value but
     never appears among the choices, so the stored value is neither hidden
     from the reader nor silently rewritten by rendering the row. */
  function exitOptions(cur){
    var h = "";
    if(!cur || EXITS.indexOf(cur) < 0){
      h += '<option value="' + esc(cur || "") + '" selected hidden disabled>' +
           (cur ? esc(cur) + " (old)" : "— select —") + '</option>';
    }
    EXITS.forEach(function(o){
      h += '<option value="' + esc(o) + '"' + (o === cur ? ' selected' : '') +
           '>' + esc(o) + '</option>';
    });
    return h;
  }

  function options(list, chosen){
    return list.map(function(o){
      return '<option' + (o === chosen ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join("");
  }

  function toast(msg, peer){
    var box = byId("toasts");
    var t = document.createElement("div");
    t.className = "toast" + (peer ? " peer" : "");
    t.textContent = msg;
    box.appendChild(t);
    setTimeout(function(){ t.remove(); }, peer ? 4200 : 2800);
    while(box.children.length > 4) box.removeChild(box.firstChild);
  }
  function copyOut(text, title){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(
        function(){ toast("Copied — send it"); },
        function(){ showCopyBox(text, title); });
    } else { showCopyBox(text, title); }
  }
  function showCopyBox(text, title){
    var d = byId("copyBox"), ta = byId("copyText");
    byId("copyTitle").textContent = title || "Copy this";
    ta.value = text;
    if(typeof d.showModal === "function") d.showModal(); else d.setAttribute("open","");
    ta.focus(); ta.select();
  }

  /* ===================== model ===================== */
  function boardOf(d){ return BOARDS.indexOf(d.board) >= 0 ? d.board : "acq"; }
  /* Two deeds record on a deal: the seller's side (title in) and the
     buyer's side (title out). Older rows stored a single flat entry —
     read that as the buyer side so nothing is lost. */
  function rec(d, side){
    var r = d.recorded;
    if(!r) return null;
    if(r.doc) return side === "buyer" ? r : null;
    return r[side] && r[side].doc ? r[side] : null;
  }
  function anyRec(d){ return !!(rec(d,"buyer") || rec(d,"seller")); }
  function bothRec(d){ return !!(rec(d,"buyer") && rec(d,"seller")); }
  function statusOf(d){
    var list = STATUS[boardOf(d)];
    return list.indexOf(d.status) >= 0 ? d.status : list[0];
  }
  function daysToClose(d){ return dayDiff(todayISO(), d.closingDate); }
  function isDead(d){ return statusOf(d) === "Cancelled"; }
  function isDone(d){
    var s = statusOf(d);
    return s === "Acquired" || s === "Wholesaled" || s === "Sold" || s === "Closed";
  }
  function overdue(d){
    if(isDone(d) || isDead(d) || anyRec(d)) return false;
    var n = daysToClose(d);
    return n != null && n < 0;
  }
  /* Colour follows the status the team set. Being past the closing date
     paints the row red as a warning, but it never renames the status. */
  function toneOf(d){
    if(overdue(d)) return "red";
    var base = TONE[statusOf(d)] || "blue";
    if(base === "green" || base === "grey") return base;
    var n = daysToClose(d);
    if(n != null && n >= 0 && n <= RISK_WINDOW) return "amber";
    return base;
  }
  /* The headline on a row is ALWAYS the status from its dropdown — nothing
     else (a recording, a sale price, a passed date) overwrites it. Timing
     goes on the second line, where it informs without relabelling. */
  function flagOf(d){
    var s = statusOf(d), n = daysToClose(d), sub;
    if(isDead(d))              sub = "Off the goal";
    else if(overdue(d))        sub = plural(-n, "day") + " past closing";
    else if(isDone(d))         sub = d.closingDate ? fmtDate(d.closingDate) : "No closing date";
    else if(n == null)         sub = "No closing date";
    else if(n < 0)             sub = plural(-n, "day") + " past closing";
    else if(n === 0)           sub = "Closes today";
    else                       sub = plural(n, "day") + " to close";
    return {text:s, sub:sub};
  }
  function onBoard(b){
    var arr = [];
    deals.forEach(function(d, id){ if(boardOf(d) === b) arr.push({id:id, d:d}); });
    arr.sort(function(a,b2){
      var ao = overdue(a.d) ? 0 : 1, bo = overdue(b2.d) ? 0 : 1;
      if(ao !== bo) return ao - bo;
      var ad = isDead(a.d) ? 1 : 0, bd = isDead(b2.d) ? 1 : 0;
      if(ad !== bd) return ad - bd;
      var ac = a.d.closingDate || "9999-99-99", bc = b2.d.closingDate || "9999-99-99";
      if(ac !== bc) return ac < bc ? -1 : 1;
      return (a.d.addr || "") < (b2.d.addr || "") ? -1 : 1;
    });
    return arr;
  }
  function logLines(d){
    var out = [], log = d.log || {};
    Object.keys(log).forEach(function(k){ if(log[k] && typeof log[k] === "object") out.push(log[k]); });
    out.sort(function(a,b){ return (a.at || "") < (b.at || "") ? 1 : -1; });
    return out.slice(0, 40);
  }

  function summaryText(d){
    var L = [BOARD_NAME[boardOf(d)].toUpperCase() + " — " + d.addr];
    L.push("Status: " + statusOf(d) + (d.closingDate ? " · closing " + fmtDate(d.closingDate) : ""));
    if(d.leadSource)   L.push("Lead source: " + d.leadSource);
    if(num(d.purchasePrice) != null) L.push("Purchase: " + money(num(d.purchasePrice)));
    if(num(d.salePrice) != null)     L.push("Sale: " + money(num(d.salePrice)));
    if(num(d.revenue) != null)       L.push("Projected revenue: " + money(num(d.revenue)));
    if(d.exit)   L.push("Exit: " + d.exit);
    if(d.owner)  L.push("Owner: " + d.owner + (d.escrow ? " · " + d.escrow : ""));
    ["buyer","seller"].forEach(function(side){
      var r = rec(d, side), name = side === "buyer" ? "Buyer" : "Seller";
      L.push(r
        ? name + " document: #" + r.doc + " recorded " + fmtDate(r.date) +
          ", confirmed by " + r.by + " (" + r.source + ")."
        : name + " document: NOT RECORDED — no doc number yet.");
    });
    return L.join("\n");
  }
  function escalateText(d){
    var n = daysToClose(d), head;
    if(overdue(d)) head = "PAST CLOSING — " + plural(-n, "day") + " overdue";
    else if(n != null && n <= RISK_WINDOW) head = "CLOSING IN " + plural(n, "day");
    else head = "PUSHING";
    return head + " — " + d.addr + ".\n" +
      "Board: " + BOARD_NAME[boardOf(d)] + " · status " + statusOf(d) + ".\n" +
      (d.closingDate ? "Closing date on the board: " + fmtDate(d.closingDate) + ".\n" : "") +
      "Owner: " + (d.owner || "unassigned") + (d.escrow ? " · " + d.escrow : "") + ".\n" +
      "Today: " + (d.owner || "the owner") + " gets written confirmation from title/escrow — " +
      "a doc number or a new recording date. Nothing here is closed until it records.";
  }

  /* ===================== persistence ===================== */
  function soloLoad(){
    try {
      var obj = JSON.parse(localStorage.getItem(SOLO_KEY) || "{}") || {};
      Object.keys(obj).forEach(function(id){ deals.set(id, obj[id]); });
    } catch(e){}
  }
  function soloSave(){
    try {
      var obj = {};
      deals.forEach(function(d, id){ obj[id] = d; });
      localStorage.setItem(SOLO_KEY, JSON.stringify(obj));
    } catch(e){}
  }
  function mergeInto(target, patch){
    Object.keys(patch).forEach(function(k){
      var v = patch[k];
      if(v && typeof v === "object" && !Array.isArray(v) &&
         target[k] && typeof target[k] === "object" && !Array.isArray(target[k])){
        mergeInto(target[k], v);
      } else { target[k] = v; }
    });
    return target;
  }
  function writeFailed(e){
    var code = e && e.code;
    if(code === "revoked" || code === "not_granted"){
      live = false; setConn(); toast("Read-only here — changes are not saving");
    } else if(code === "quota_exceeded"){
      toast("Board is full — clear out old rows first");
    } else { toast("That did not save — try again"); }
  }
  function createDeal(body){
    var id = uid();
    if(live) db.collection("deals").doc(id).set(body).catch(writeFailed);
    else { deals.set(id, body); soloSave(); lastSig = null; render(); }
    return id;
  }
  function patchDeal(id, patch){
    if(live) db.collection("deals").doc(id).update(patch).catch(writeFailed);
    else {
      var d = deals.get(id);
      if(d){ mergeInto(d, patch); soloSave(); lastSig = null; render(); }
    }
  }
  function dropDeal(id){
    opened["delete"](id); drafts["delete"](id);
    if(live) db.collection("deals").doc(id)["delete"]().catch(writeFailed);
    else { deals["delete"](id); soloSave(); lastSig = null; render(); }
  }
  function entry(text){
    var p = {log:{}};
    p.log[logKey()] = {at:new Date().toISOString(), by:who(), text:text};
    return p;
  }
  function announce(text){
    if(!room) return;
    room.emit("activity", {text:String(text).slice(0,140)}).catch(function(){});
  }

  /* ===================== render ===================== */
  function captureFocus(){
    var a = document.activeElement;
    if(!a || !a.closest) return null;
    var row = a.closest("#ledger [data-id]");
    if(!row || !a.dataset || !a.dataset.f) return null;
    var f = {id:row.dataset.id, key:a.dataset.f, s:null, e:null};
    try { f.s = a.selectionStart; f.e = a.selectionEnd; } catch(err){}
    return f;
  }
  function restoreFocus(f){
    if(!f) return;
    var row = byId("ledger").querySelector('[data-id="' + f.id.replace(/"/g,"") + '"]');
    if(!row) return;
    var el = row.querySelector('[data-f="' + f.key + '"]');
    if(!el) return;
    el.focus();
    if(f.s != null && el.setSelectionRange){ try { el.setSelectionRange(f.s, f.e); } catch(err){} }
  }
  function signature(){
    var parts = [board, filter, me, live?1:0, connected?1:0,
      peers.map(function(p){ return p.peer + ":" + (p.presence && p.presence.name || ""); }).join(",")];
    var ids = [];
    deals.forEach(function(d, id){ ids.push(id); });
    ids.sort();
    ids.forEach(function(id){
      var d = deals.get(id);
      parts.push([id, d.board, d.addr, d.owner, d.escrow, d.leadSource, d.exit, d.status,
        d.purchasePrice, d.salePrice, d.revenue, d.closingDate,
        d.recorded ? JSON.stringify(d.recorded) : 0, d.crm?1:0, d.notified?1:0,
        Object.keys(d.log || {}).length].join("|"));
    });
    return parts.join("~");
  }

  function render(){
    var sig = signature();
    if(sig === lastSig) return;
    lastSig = sig;

    if(byId("me").value !== me) byId("me").value = me;

    /* board counts */
    var counts = {acq:0, dispo:0, sold:0};
    deals.forEach(function(d){ counts[boardOf(d)]++; });
    BOARDS.forEach(function(b){
      var el = byId("boards").querySelector('[data-bc="' + b + '"]');
      if(el) el.textContent = counts[b];
      var btn = byId("boards").querySelector('[data-b="' + b + '"]');
      if(btn) btn.setAttribute("aria-pressed", String(b === board));
    });

    renderGoal();
    renderTiles();
    renderFilters();

    var focus = captureFocus();
    var rows = onBoard(board).filter(function(x){ return passFilter(x.d); });
    var html = "";
    for(var i = 0; i < rows.length; i++) html += rowHTML(rows[i].id, rows[i].d);
    byId("ledger").innerHTML = html;

    var none = !rows.length;
    byId("empty").classList.toggle("hidden", !none);
    if(none){
      var any = counts[board] > 0;
      byId("emptyTitle").textContent = any ? "Nothing in this filter" : "Nothing on " + BOARD_NAME[board];
      byId("emptyText").textContent = any
        ? "No property on this board is in that state right now."
        : "Add the first property and it shows up for everyone on this link.";
    }
    restoreFocus(focus);
    byId("exportBtn").disabled = !counts[board];
    renderWho();
  }

  function renderGoal(){
    var done = 0, wip = 0;
    deals.forEach(function(d){
      if(isDead(d)) return;
      if(isDone(d) || boardOf(d) === "sold") done++;
      else wip++;
    });
    var dPct = Math.min(100, (done / GOAL) * 100);
    var wPct = Math.min(100 - dPct, (wip / GOAL) * 100);
    byId("track").innerHTML =
      '<i class="done" style="width:' + dPct.toFixed(1) + '%"></i>' +
      '<i class="wip" style="width:' + wPct.toFixed(1) + '%"></i>';
    byId("trackLeft").textContent = done + " closed · " + wip + " working";
    byId("trackRight").textContent = Math.max(0, GOAL - done) + " to go";
    byId("goalLine").innerHTML = 'Goal <b>' + GOAL + '</b> properties';

    var od = 0;
    deals.forEach(function(d){ if(overdue(d)) od++; });
    byId("vsub").textContent = od
      ? od + " past its closing date and still not recorded. Those are the calls to make today."
      : "Acquisition, disposition and what actually sold. Nothing counts as closed until it records.";
  }

  function sum(b, field){
    var t = 0;
    deals.forEach(function(d){
      if(boardOf(d) !== b || isDead(d)) return;
      var n = num(d[field]);
      if(n != null) t += n;
    });
    return t;
  }
  function countStatus(b, s){
    var n = 0;
    deals.forEach(function(d){ if(boardOf(d) === b && statusOf(d) === s) n++; });
    return n;
  }
  function tile(cls, value, label){
    return '<div class="tile ' + cls + '"><b>' + esc(value) + '</b><em>' + esc(label) + '</em></div>';
  }
  function renderTiles(){
    var h = "", od = 0;
    onBoard(board).forEach(function(x){ if(overdue(x.d)) od++; });
    if(board === "acq"){
      h += tile("blue",  countStatus("acq","Under contract"), "Under contract");
      h += tile("green", countStatus("acq","Acquired"), "Acquired");
      h += tile("green", countStatus("acq","Wholesaled"), "Wholesaled");
      h += tile("grey",  countStatus("acq","Cancelled"), "Cancelled");
      h += tile("cash",  moneyShort(sum("acq","purchasePrice")), "Purchase committed");
    } else if(board === "dispo"){
      h += tile("amber", countStatus("dispo","Under construction"), "Under construction");
      h += tile("blue",  countStatus("dispo","Listed") + countStatus("dispo","Listed — pending"), "Listed");
      h += tile("green", countStatus("dispo","Sold"), "Sold");
      h += tile("cash",  moneyShort(sum("dispo","purchasePrice")), "Cost basis");
      h += tile("cash",  moneyShort(sum("dispo","salePrice")), "Sale pending");
    } else {
      var n = 0; deals.forEach(function(d){ if(boardOf(d) === "sold") n++; });
      h += tile("green", n, "Sold this month");
      h += tile("cash",  moneyShort(sum("sold","purchasePrice")), "Purchase");
      h += tile("cash",  moneyShort(sum("sold","salePrice")), "Sale price");
      h += tile("cash",  moneyShort(sum("sold","revenue")), "Projected revenue");
    }
    if(od) h += tile("red", od, "Past closing");
    byId("tiles").innerHTML = h;
  }

  function filterList(){
    var l = [{k:"all", label:"All"}];
    STATUS[board].forEach(function(s){ l.push({k:s, label:s}); });
    l.push({k:"overdue", label:"Past closing"});
    l.push({k:"unrecorded", label:"Not recorded"});
    return l;
  }
  function passFilter(d){
    if(filter === "all") return true;
    if(filter === "overdue") return overdue(d);
    if(filter === "unrecorded") return !bothRec(d);
    return statusOf(d) === filter;
  }
  function renderFilters(){
    var counts = {};
    onBoard(board).forEach(function(x){
      var d = x.d;
      counts.all = (counts.all || 0) + 1;
      counts[statusOf(d)] = (counts[statusOf(d)] || 0) + 1;
      if(overdue(d)) counts.overdue = (counts.overdue || 0) + 1;
      if(!bothRec(d)) counts.unrecorded = (counts.unrecorded || 0) + 1;
    });
    byId("filters").innerHTML = filterList().map(function(f){
      return '<button type="button" data-f="' + esc(f.k) + '" aria-pressed="' +
        (filter === f.k) + '">' + esc(f.label) + ' <b>' + (counts[f.k] || 0) + '</b></button>';
    }).join("");
  }

  function stat(label, value, cls){
    return '<div class="stat"><em>' + esc(label) + '</em><span' +
      (value ? (cls ? ' class="' + cls + '">' : '>') : ' class="miss">—') + esc(value) + '</span></div>';
  }
  function statsFor(d){
    var b = boardOf(d), h = "";
    h += stat("Lead source", d.leadSource || "");
    h += stat("Purchase price", money(num(d.purchasePrice)), "money");
    if(b === "acq"){
      h += stat("Closing date", fmtDate(d.closingDate));
      h += stat("Exit strategy", d.exit || "");
    } else if(b === "dispo"){
      h += stat("Exit strategy", d.exit || "");
      h += stat("Closing date", fmtDate(d.closingDate));
      h += stat("Sale price", money(num(d.salePrice)), "money");
    } else {
      h += stat("Exit", d.exit || "");
      h += stat("Closing date", fmtDate(d.closingDate));
      h += stat("Sale price", money(num(d.salePrice)), "money");
      h += stat("Projected revenue", money(num(d.revenue)), "money");
    }
    return h;
  }

  function rowHTML(id, d){
    var b = toneOf(d), f = flagOf(d), draft = drafts.get(id) || {};
    var bd = boardOf(d);

    var meta = [];
    if(d.owner)  meta.push('Owner <b>' + esc(d.owner) + '</b>');
    if(d.escrow) meta.push(esc(d.escrow));
    if(!meta.length) meta.push('<b>No owner yet</b>');

    var h = '<article class="row" data-tone="' + b + '" data-id="' + esc(id) + '">';
    h += '<div class="head"><div><h2 class="addr">' + esc(d.addr) + '</h2>' +
         '<div class="meta">' + meta.join(' &nbsp;·&nbsp; ') + '</div></div>' +
         '<div class="flag" data-tone="' + b + '">' + esc(f.text) +
         '<u>' + esc(f.sub) + '</u></div></div>';

    h += '<div class="strip">';
    h += '<div class="stats">' + statsFor(d) + '</div>';

    h += '<div class="fields">' +
         '<div class="f"><label for="st-' + esc(id) + '">Status</label>' +
         '<select id="st-' + esc(id) + '" data-f="status" data-act="status">' +
         options(STATUS[bd], statusOf(d)) + '</select></div>' +
         '<div class="f"><label for="cd-' + esc(id) + '">Closing date</label>' +
         '<input type="date" id="cd-' + esc(id) + '" data-f="closingDate" data-act="closingDate" value="' +
         esc(d.closingDate || "") + '"></div>' +
         '<div class="f"><label for="ex-' + esc(id) + '">Exit strategy</label>' +
         '<select id="ex-' + esc(id) + '" data-f="exit" data-act="exit">' +
         exitOptions(d.exit || "") + '</select></div>' +
         (bd === "acq" ? ""
           : '<div class="f"><label for="sp-' + esc(id) + '">Sale price</label>' +
             '<input id="sp-' + esc(id) + '" inputmode="numeric" data-f="salePrice" data-act="salePrice" ' +
             'placeholder="0" value="' + esc(num(d.salePrice) == null ? "" : num(d.salePrice)) + '"></div>') +
         '</div>';

    SIDES.forEach(function(side){
      var r = rec(d, side.key);
      if(!r) return;
      h += '<p class="stamp"><b>' + esc(side.name) + '</b> DOC #' + esc(r.doc) +
           ' · ' + esc(fmtDate(r.date)) +
           '<small>Confirmed by ' + esc(r.by) + ' · ' + esc(r.source) +
           ' · ' + esc(fmtStamp(r.at)) + '</small></p>';
    });

    SIDES.forEach(function(side){
      var r = rec(d, side.key), k = side.key;
      var docVal  = draft[k+"Doc"]    != null ? draft[k+"Doc"]    : (r ? r.doc : "");
      var dateVal = draft[k+"Date"]   != null ? draft[k+"Date"]   : (r ? r.date : "");
      var srcVal  = draft[k+"Source"] != null ? draft[k+"Source"] : (r ? r.source : SOURCES[0]);
      h += '<div class="recgrp"' + (r ? ' data-done="1"' : '') + '>' +
           '<div class="recgrp-h">' + esc(side.name) + ' document' +
           (r ? '<i>recorded</i>' : '<i class="pending">not recorded</i>') + '</div>' +
           '<div class="fields">' +
           '<div class="f"><label for="' + k + 'doc-' + esc(id) + '">Doc / instrument #</label>' +
           '<input class="doc" id="' + k + 'doc-' + esc(id) + '" data-f="' + k + 'Doc" ' +
           'placeholder="2026-041877" value="' + esc(docVal) + '" maxlength="32"></div>' +
           '<div class="f"><label for="' + k + 'dt-' + esc(id) + '">Recorded on</label>' +
           '<input type="date" id="' + k + 'dt-' + esc(id) + '" data-f="' + k + 'Date" ' +
           'value="' + esc(dateVal) + '"></div>' +
           '<div class="f"><label for="' + k + 'src-' + esc(id) + '">Proof</label>' +
           '<select id="' + k + 'src-' + esc(id) + '" data-f="' + k + 'Source">' +
           options(SOURCES, srcVal) + '</select></div>' +
           '</div></div>';
    });

    var moveLabel = bd === "acq" ? "Move to disposition"
                  : bd === "dispo" ? "Mark sold this month" : "Back to disposition";
    h += '<div class="btns">' +
         '<button type="button" class="b go" data-act="record">' +
         (anyRec(d) ? "Update recording" : "Confirm recorded") + '</button>' +
         '<button type="button" class="b ghost mid" data-act="move">' + moveLabel + '</button>' +
         '<button type="button" class="b hot" data-act="esc">Escalate</button>' +
         '</div>';

    h += '<p class="warn hidden" data-warn></p></div>';

    var lines = logLines(d);
    h += '<details class="log"' + (opened.has(id) ? ' open' : '') +
         '><summary>Coordination log · ' + lines.length + '</summary><ol>';
    lines.forEach(function(e){
      var author = e.by || "System";
      h += '<li class="' + (e.kind === "note" ? "note" : "sys") + '">' +
           '<b class="au" style="color:' + esc(colorFor(author)) + '">' + esc(author) + '</b>' +
           '<span class="tx">' + esc(e.text) + '</span>' +
           '<time>' + esc(fmtStamp(e.at)) + '</time></li>';
    });
    h += '</ol>';
    h += '<div class="post">' +
         '<input id="note-' + esc(id) + '" data-f="note" maxlength="240" ' +
         'placeholder="Add an update everyone can see…" aria-label="Add an update" value="' +
         esc(draft.note || "") + '">' +
         '<button type="button" data-act="note">Post</button></div>';
    h += '<div class="follow">' +
         '<button type="button" class="tag" data-act="crm" aria-pressed="' + (d.crm?"true":"false") +
         '">CRM updated' + (d.crm ? " ✓" : "") + '</button>' +
         '<button type="button" class="tag" data-act="notified" aria-pressed="' +
         (d.notified?"true":"false") + '">Team notified' + (d.notified ? " ✓" : "") + '</button>' +
         '<button type="button" class="tag" data-act="copy">Copy summary</button>' +
         SIDES.map(function(side){
           return rec(d, side.key)
             ? '<button type="button" class="tag danger" data-act="reopen" ' +
               'data-side="' + side.key + '">Reopen ' + esc(side.name.toLowerCase()) + '</button>'
             : '';
         }).join("") +
         '<button type="button" class="tag danger" data-act="rm">Remove</button>' +
         '</div></details>';

    return h + '</article>';
  }

  function renderWho(){
    var list = peers.slice().sort(function(a,b){ return (b.isMe?1:0) - (a.isMe?1:0); });
    var html = "";
    list.slice(0, 6).forEach(function(p){
      var name = (p.presence && typeof p.presence.name === "string" && p.presence.name.trim())
        ? p.presence.name.trim().slice(0,24)
        : (p.kind === "agent" ? "Claude" : "Unnamed");
      var col = (p.presence && /^#[0-9a-f]{6}$/i.test(p.presence.color)) ? p.presence.color : colorFor(name);
      html += '<span class="chip' + (p.isMe ? ' self' : '') + '" title="' + esc(name) + '">' +
              '<i style="background:' + esc(col) + '">' + esc(initials(name)) + '</i>' +
              '<s>' + esc(name) + '</s></span>';
    });
    if(list.length > 6) html += '<span class="chip"><s>+' + (list.length - 6) + ' more</s></span>';
    byId("who").innerHTML = html;
  }
  function setConn(){
    var el = byId("conn"), txt = byId("connText");
    if(live && connected){
      el.setAttribute("data-on","1");
      var n = peers.length || 1;
      txt.textContent = "Live · " + n + (n === 1 ? " person" : " people") + " on the board";
    } else if(live){
      el.setAttribute("data-on","1"); txt.textContent = "Live · shared board";
    } else {
      el.setAttribute("data-on","solo"); txt.textContent = "Solo · saved in this browser only";
    }
  }

  /* ===================== actions ===================== */
  function needMe(){
    if(me.trim()) return true;
    toast("Put your name in first");
    byId("me").focus();
    return false;
  }

  var INLINE = {status:"Status", closingDate:"Closing date", exit:"Exit strategy", salePrice:"Sale price"};

  byId("ledger").addEventListener("toggle", function(e){
    var det = e.target;
    if(!det || det.tagName !== "DETAILS") return;
    var row = det.closest("[data-id]");
    if(!row) return;
    if(det.open) opened.add(row.dataset.id); else opened["delete"](row.dataset.id);
  }, true);

  function noteDraft(e){
    var t = e.target;
    if(!t.dataset || !t.dataset.f || INLINE[t.dataset.f]) return;
    var row = t.closest("[data-id]");
    if(!row) return;
    var d = drafts.get(row.dataset.id) || {};
    d[t.dataset.f] = t.value;
    drafts.set(row.dataset.id, d);
  }
  byId("ledger").addEventListener("input", noteDraft);

  byId("ledger").addEventListener("keydown", function(e){
    if(e.key !== "Enter" || !e.target.dataset || e.target.dataset.f !== "note") return;
    e.preventDefault();
    var row = e.target.closest("[data-id]");
    var btn = row && row.querySelector('[data-act="note"]');
    if(btn) btn.click();
  });

  byId("ledger").addEventListener("change", function(e){
    var t = e.target;
    noteDraft(e);
    var key = t.dataset && t.dataset.f;
    if(!key || !INLINE[key]) return;
    var row = t.closest("[data-id]");
    if(!row) return;
    var id = row.dataset.id, d = deals.get(id);
    if(!d) return;
    if(!needMe()){ lastSig = null; render(); return; }

    var val = t.value;
    if(key === "salePrice"){
      var n = num(val);
      if(num(d.salePrice) === n) return;
      patchDeal(id, mergeInto({salePrice:n},
        entry("Sale price set to " + (n == null ? "—" : money(n)) + " by " + who() + ".")));
    } else {
      var cur = key === "status" ? statusOf(d) : (d[key] || "");
      if(cur === val) return;
      var patch = {};
      patch[key] = val;
      var shown = key === "closingDate" ? fmtDate(val) : val;
      patchDeal(id, mergeInto(patch,
        entry(shown
          ? INLINE[key] + " set to " + shown + " by " + who() + "."
          : INLINE[key] + " cleared by " + who() + ".")));
      if(shown) announce(who() + " — " + d.addr + ": " + INLINE[key] + " " + shown);
    }
  });

  byId("ledger").addEventListener("click", function(e){
    var btn = e.target.closest("button[data-act]");
    if(!btn) return;
    var row = e.target.closest(".row");
    if(!row) return;
    var id = row.dataset.id, d = deals.get(id);
    if(!d) return;
    var a = btn.dataset.act, bd = boardOf(d);

    if(a === "record"){
      if(!needMe()) return;
      var warn = row.querySelector("[data-warn]");
      var patch = {recorded:{}}, saved = [], partial = null, blank = 0;

      SIDES.forEach(function(side){
        var k = side.key;
        var doc = row.querySelector('[data-f="' + k + 'Doc"]').value.trim();
        var dt  = row.querySelector('[data-f="' + k + 'Date"]').value;
        var src = row.querySelector('[data-f="' + k + 'Source"]').value;
        var filled = (doc ? 1 : 0) + (dt ? 1 : 0) + (src !== SOURCES[0] ? 1 : 0);
        if(filled === 0){ blank++; return; }
        if(filled < 3){
          if(!partial) partial = {side:side, doc:doc, dt:dt, src:src};
          return;
        }
        var prev = rec(d, k);
        if(prev && prev.doc === doc && prev.date === dt && prev.source === src) return;
        patch.recorded[k] = {at:new Date().toISOString(), by:who(), doc:doc, date:dt, source:src};
        saved.push({side:side, doc:doc, dt:dt, src:src, update:!!prev});
      });

      if(partial){
        warn.textContent = "The " + partial.side.name.toLowerCase() +
          " document needs all three: instrument number, recording date and how it was proved.";
        warn.classList.remove("hidden");
        row.querySelector('[data-f="' + partial.side.key +
          (!partial.doc ? 'Doc' : (!partial.dt ? 'Date' : 'Source')) + '"]').focus();
        return;
      }
      if(!saved.length){
        if(blank === SIDES.length){
          warn.textContent = "No doc number, no close. Fill in the buyer document, the seller document, or both.";
          warn.classList.remove("hidden");
          row.querySelector('[data-f="buyerDoc"]').focus();
        }
        return;
      }
      warn.classList.add("hidden");

      saved.forEach(function(x){
        mergeInto(patch, entry((x.update ? x.side.name + " recording updated — doc #"
                                         : x.side.name.toUpperCase() + " RECORDED — doc #") +
          x.doc + " on " + fmtDate(x.dt) + ", confirmed by " + who() + " (" + x.src + ")."));
      });
      patchDeal(id, patch);
      var dr = drafts.get(id) || {};
      saved.forEach(function(x){
        delete dr[x.side.key + "Doc"]; delete dr[x.side.key + "Date"]; delete dr[x.side.key + "Source"];
      });
      drafts.set(id, dr);
      announce(who() + " recorded " + d.addr + " · " +
        saved.map(function(x){ return x.side.name.toLowerCase() + " #" + x.doc; }).join(", "));
      toast(saved.length > 1 ? "Both documents recorded" : saved[0].side.name + " document recorded");
      return;
    }

    if(a === "move"){
      if(!needMe()) return;
      var to = bd === "acq" ? "dispo" : bd === "dispo" ? "sold" : "dispo";
      if(!confirm("Move " + d.addr + " to " + BOARD_NAME[to] + "?")) return;
      var patch = {board:to, status:STATUS[to][0]};
      if(to === "sold"){
        patch.status = "Closed";
        if(num(d.revenue) == null && num(d.salePrice) != null && num(d.purchasePrice) != null){
          patch.revenue = num(d.salePrice) - num(d.purchasePrice);
        }
      }
      patchDeal(id, mergeInto(patch,
        entry("Moved to " + BOARD_NAME[to] + " by " + who() + ".")));
      announce(who() + " moved " + d.addr + " to " + BOARD_NAME[to]);
      toast("Moved to " + BOARD_NAME[to]);
      return;
    }

    if(a === "reopen"){
      if(!needMe()) return;
      var sk = btn.dataset.side === "seller" ? "seller" : "buyer";
      var nm = sk === "seller" ? "Seller" : "Buyer";
      if(!confirm("Reopen the " + nm.toLowerCase() + " document on " + d.addr +
                  "? That doc number comes off the board for everyone.")) return;
      var other = rec(d, sk === "buyer" ? "seller" : "buyer");
      var np = {recorded:{}};
      np.recorded[sk] = null;
      np.recorded[sk === "buyer" ? "seller" : "buyer"] = other || null;
      patchDeal(id, mergeInto(np,
        entry(nm + " recording pulled by " + who() + " — needs re-verification.")));
      var dr2 = drafts.get(id) || {};
      delete dr2[sk + "Doc"]; delete dr2[sk + "Date"]; delete dr2[sk + "Source"];
      drafts.set(id, dr2);
      announce(who() + " reopened the " + nm.toLowerCase() + " document on " + d.addr);
      return;
    }

    if(a === "crm"){
      if(!needMe()) return;
      patchDeal(id, d.crm
        ? mergeInto({crm:null}, entry("CRM flag removed by " + who() + "."))
        : mergeInto({crm:{at:new Date().toISOString(), by:who()}}, entry("CRM updated by " + who() + ".")));
      return;
    }
    if(a === "notified"){
      if(!needMe()) return;
      patchDeal(id, d.notified
        ? mergeInto({notified:null}, entry("Team-notified flag removed by " + who() + "."))
        : mergeInto({notified:{at:new Date().toISOString(), by:who()}},
            entry("Team notified by " + who() + ".")));
      return;
    }
    if(a === "note"){
      if(!needMe()) return;
      var box = row.querySelector('[data-f="note"]');
      var text = box.value.trim();
      if(!text){ box.focus(); return; }
      var np = {log:{}};
      np.log[logKey()] = {at:new Date().toISOString(), by:who(), text:text, kind:"note"};
      /* clear the draft BEFORE the write — patchDeal can re-render synchronously */
      var dr = drafts.get(id) || {};
      dr.note = "";
      drafts.set(id, dr);
      opened.add(id);
      box.value = "";
      patchDeal(id, np);
      announce(who() + " on " + d.addr + ": " + text);
      return;
    }

    if(a === "copy"){ copyOut(summaryText(d), d.addr); return; }
    if(a === "esc"){
      copyOut(escalateText(d), "Escalate — " + d.addr);
      patchDeal(id, entry("Escalated by " + who() + "."));
      announce(who() + " escalated " + d.addr);
      return;
    }
    if(a === "rm"){
      if(!confirm("Remove " + d.addr + " from the board for everyone? The log goes with it.")) return;
      dropDeal(id);
      announce(who() + " removed " + d.addr);
      return;
    }
  });

  byId("me").addEventListener("input", function(e){
    me = e.target.value; writeName(me); pushPresence(); lastSig = null;
  });

  /* board switch */
  byId("boards").addEventListener("click", function(e){
    var b = e.target.closest("button[data-b]");
    if(!b) return;
    board = b.dataset.b; writeBoard(board);
    filter = "all"; lastSig = null; render();
  });
  byId("filters").addEventListener("click", function(e){
    var b = e.target.closest("button[data-f]");
    if(!b) return;
    filter = b.dataset.f; lastSig = null; render();
  });

  /* add panel */
  byId("n-lead").innerHTML = options(LEADS, LEADS[0]);
  byId("n-exit").innerHTML = exitOptions("");
  function syncStatusChoices(){
    byId("n-status").innerHTML = options(STATUS[board], STATUS[board][0]);
    byId("n-sale").closest(".f").classList.toggle("hidden", board === "acq");
  }
  function showAdd(v){
    if(v) syncStatusChoices();
    byId("addPanel").classList.toggle("hidden", !v);
    if(v) byId("n-addr").focus(); else byId("addWarn").classList.add("hidden");
  }
  byId("addBtn").addEventListener("click", function(){ showAdd(true); });
  byId("emptyAdd").addEventListener("click", function(){ showAdd(true); });
  byId("cancelNew").addEventListener("click", function(){ showAdd(false); });

  byId("saveNew").addEventListener("click", function(){
    var addr = byId("n-addr").value.trim();
    var w = byId("addWarn");
    if(!addr){
      w.textContent = "A property address, at minimum. Everything else can land later.";
      w.classList.remove("hidden"); byId("n-addr").focus(); return;
    }
    w.classList.add("hidden");
    var now = new Date().toISOString();
    var sale = board === "acq" ? null : num(byId("n-sale").value);
    var buy  = num(byId("n-price").value);
    var body = {
      board:board, addr:addr,
      leadSource:byId("n-lead").value, exit:byId("n-exit").value,
      status:byId("n-status").value,
      purchasePrice:buy, salePrice:sale,
      revenue:(board === "sold" && sale != null && buy != null) ? sale - buy : null,
      closingDate:byId("n-close").value || null,
      owner:byId("n-owner").value.trim(), escrow:byId("n-escrow").value.trim(),
      createdAt:now, createdBy:who(),
      recorded:null, crm:null, notified:null, log:{}
    };
    body.log[logKey()] = {at:now, by:who(),
      text:"On the " + BOARD_NAME[board] + " board. " + byId("n-status").value +
           (body.closingDate ? ", closing " + fmtDate(body.closingDate) : "") + "."};
    createDeal(body);
    ["n-addr","n-price","n-close","n-sale","n-owner","n-escrow"].forEach(function(i){ byId(i).value = ""; });
    /* reset the exit picker too — it has no safe default, so the next
       property must not silently inherit this one's strategy */
    byId("n-exit").innerHTML = exitOptions("");
    showAdd(false);
    announce(who() + " added " + addr + " to " + BOARD_NAME[board]);
  });

  /* export */
  function csv(){
    var head = ["Board","Property address","Lead source","Owner","Title/Escrow","Status",
                "Purchase price","Sale price","Projected revenue","Closing date","Exit strategy",
                "Days to close","Both documents recorded",
                "Buyer doc number","Buyer recorded on","Buyer confirmed by","Buyer proof",
                "Seller doc number","Seller recorded on","Seller confirmed by","Seller proof",
                "CRM","Team notified"];
    var q = function(v){ return '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"'; };
    var rows = [head.map(q).join(",")];
    onBoard(board).forEach(function(x){
      var d = x.d, n = daysToClose(d), rb = rec(d,"buyer"), rs = rec(d,"seller");
      rows.push([
        BOARD_NAME[boardOf(d)], d.addr, d.leadSource || "", d.owner || "", d.escrow || "",
        statusOf(d), num(d.purchasePrice), num(d.salePrice), num(d.revenue),
        d.closingDate || "", d.exit || "", n == null ? "" : n,
        bothRec(d) ? "yes" : "no",
        rb ? rb.doc : "", rb ? rb.date : "", rb ? rb.by : "", rb ? rb.source : "",
        rs ? rs.doc : "", rs ? rs.date : "", rs ? rs.by : "", rs ? rs.source : "",
        d.crm ? "yes" : "no", d.notified ? "yes" : "no"
      ].map(q).join(","));
    });
    return rows.join("\r\n");
  }
  byId("exportBtn").addEventListener("click", function(){
    var text = csv();
    if(text.indexOf("\r\n") < 0){ toast("Nothing to export on this board"); return; }
    var name = board + "-board-" + todayISO() + ".csv";
    if(dl){
      dl.save({filename:name, data:text}).then(
        function(){ toast("Saved " + name); },
        function(err){
          if(err && err.code === "declined") return;
          showCopyBox(text, "CSV — copy it out");
        });
    } else { showCopyBox(text, "CSV — copy it out"); }
  });

  byId("copyClose").addEventListener("click", function(){
    var d = byId("copyBox");
    if(typeof d.close === "function") d.close(); else d.removeAttribute("open");
  });
  byId("copyAgain").addEventListener("click", function(){
    var ta = byId("copyText");
    ta.focus(); ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch(e){}
    toast(ok ? "Copied — send it" : "Selected — press Ctrl/Cmd + C");
  });

  /* ===================== room ===================== */
  function pushPresence(){
    if(!room) return;
    room.presence({
      name: me.trim().slice(0,24) || null,
      color: colorFor(me.trim() || "anon"),
      board: board
    }).catch(function(){});
  }

  /* ===================== boot ===================== */
  byId("me").value = me;
  syncStatusChoices();
  soloLoad();
  setConn();
  render();

  if(window.claude && typeof window.claude.use === "function"){
    window.claude.use("db").then(function(store){
      if(!store) return;
      db = store;
      var first = true;
      db.collection("deals").onSnapshot(function(snap){
        live = true;
        var next = new Map();
        snap.docs.forEach(function(doc){
          var body = doc.data();
          if(body) next.set(doc.id, body);
        });
        if(first && deals.size && !next.size){
          first = false;
          deals.forEach(function(body, id){
            db.collection("deals").doc(id).set(body).catch(function(){});
          });
          try { localStorage.removeItem(SOLO_KEY); } catch(e){}
          toast("Moved your local board onto the shared one");
          setConn();
          return;
        }
        first = false;
        deals = next; lastSig = null; setConn(); render();
      }, function(err){
        live = false; setConn();
        if(err && err.code !== "revoked") toast("Live board dropped — working solo");
        lastSig = null; render();
      });
    });

    window.claude.use("room").then(function(r){
      if(!r) return;
      room = r;
      pushPresence();
      room.onPeers(function(change){
        peers = change.peers; lastSig = null; setConn(); renderWho();
      }, function(){});
      room.onConnection(function(on){ connected = on; setConn(); }, function(){});
      room.on("activity", function(msg){
        if(msg.isMe) return;
        var text = msg.data && typeof msg.data.text === "string" ? msg.data.text : "";
        if(text) toast(text.slice(0,140), true);
      }, function(){});
    });

    window.claude.use("downloads").then(function(d){ dl = d || null; });
  }

  setInterval(function(){ lastSig = null; render(); }, 60000);
})();
</script>
